version: 1
domain: kevis.online
provider: cloudflare
status: ns_delegated
origin:
  type: workers
  target: kevis-keyring-007.workers.dev
dns_records:
  - type: CNAME
    name: '@'
    content: kevis-keyring-007.workers.dev
    proxied: true
    ttl: 300
  - type: CNAME
    name: www
    content: kevis.online
    proxied: true
    ttl: 300
security:
  ssl_mode: full_strict
  always_https: true
  hsts: planned
routing:
  mcp_entry: https://codex.your-domain.example/mcp
notes:
  - If custom worker route is used, replace workers.dev target with routed host.
