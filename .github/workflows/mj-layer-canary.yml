name: MJ Layer Canary Proof

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Canary smoke-test base URL"
        required: true
        default: "https://mcp.ellis-aegis.us"
      execute_apply:
        description: "After environment approval, execute deploy + smoke. Default is proof/dry-run only."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  canary-proof:
    runs-on: ubuntu-latest
    environment: cloudflare-canary
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm ci --prefix projects/mj-mcp-layer --ignore-scripts --no-audit --no-fund
          npm ci --prefix projects/mj-mcp-layer/mcp-layer --ignore-scripts --no-audit --no-fund
          npm ci --prefix projects/mj-mcp-layer/platform --ignore-scripts --no-audit --no-fund
          npm ci --prefix projects/mj-mcp-layer/frontend --ignore-scripts --no-audit --no-fund

      - name: Run local proof gates
        run: npm --prefix projects/mj-mcp-layer run mj:golden

      - name: Plan Cloudflare canary deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          mkdir -p ../artifacts/evidence
          npx wrangler deploy --dry-run 2>&1 | tee ../artifacts/evidence/canary-plan.txt
          node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("../artifacts/evidence/canary-plan.json", JSON.stringify({
            generated_at: new Date().toISOString(),
            command: "npx wrangler deploy --dry-run",
            status: "planned",
            output: "canary-plan.txt"
          }, null, 2) + "\n");
          NODE
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Apply canary deploy
        if: inputs.execute_apply == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ellis-aegis-control-plane --remote --file=./migrations/0001_init.sql
          npx wrangler deploy
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Verify canary smoke
        if: inputs.execute_apply == 'true'
        env:
          MCP_SMOKE_BASE_URL: ${{ inputs.base_url }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: npm run smoke -- --base-url "${MCP_SMOKE_BASE_URL}"
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Write deployment manifest
        if: inputs.execute_apply == 'true'
        run: npm run manifest:deployment
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-layer-canary-evidence
          path: |
            projects/mj-mcp-layer/artifacts/evidence/**
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/**
          retention-days: 30
