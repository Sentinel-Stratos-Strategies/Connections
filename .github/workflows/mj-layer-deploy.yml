name: MJ Layer Deploy

on:
  workflow_dispatch:
  push:
    branches: ["MJ_Layer"]
    paths:
      - "projects/mj-mcp-layer/**"
      - ".github/workflows/mj-layer-deploy.yml"

jobs:
  harden-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zone_name: your-domain.example
            zone_id_secret: CF_ZONE_ID_ELLIS
          - zone_name: hitch.guru
            zone_id_secret: CF_ZONE_ID_HITCH
          - zone_name: kevis.online
            zone_id_secret: CF_ZONE_ID_KEVIS
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yaml parser
        run: npm install -g yaml

      - name: Resolve zone id
        id: zone
        shell: bash
        env:
          CF_ZONE_ID_ELLIS: ${{ secrets.CF_ZONE_ID_ELLIS }}
          CF_ZONE_ID_HITCH: ${{ secrets.CF_ZONE_ID_HITCH }}
          CF_ZONE_ID_KEVIS: ${{ secrets.CF_ZONE_ID_KEVIS }}
        run: |
          key='${{ matrix.zone_id_secret }}'
          val="$(printenv "$key" || true)"
          if [ -z "$val" ]; then
            echo "Missing secret $key — skipping zone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zone_id=$val" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prepare env
        if: steps.zone.outputs.skip != 'true'
        run: |
          cd projects/mj-mcp-layer
          cat > .env <<EOT
          CF_ZONE_ID=${{ steps.zone.outputs.zone_id }}
          CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
          EOT

      - name: Preflight
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/00-preflight.sh

      - name: Harden
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/99-run-cloudflare-hardening.sh

      - name: Scan
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/sentinel-scan.sh

      - name: Upload artifacts
        if: always() && steps.zone.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mj-layer-${{ matrix.zone_name }}
          path: projects/mj-mcp-layer/artifacts/**

  health-check:
    runs-on: ubuntu-latest
    needs: harden-and-scan
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Run health checks
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID_ELLIS }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/20-health-check.sh

      - name: Upload health results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-results
          path: projects/mj-mcp-layer/artifacts/health-*.json
