name: MJ Layer Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      run_hardening:
        description: "Run Cloudflare hardening after deploy and smoke pass"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["MJ_Layer", "cursor/mj-layer-enterprise-ready-1c9b"]
    paths:
      - "projects/mj-mcp-layer/**"
      - "projects/mj-mcp/**"
      - ".github/workflows/mj-layer-deploy.yml"
  pull_request:
    branches: ["MJ_Layer", "main"]
    paths:
      - "projects/mj-mcp-layer/**"
      - "projects/mj-mcp/**"
      - ".github/workflows/mj-layer-deploy.yml"

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace utilities
        run: npm ci --prefix projects/mj-mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Install Worker dependencies
        run: npm ci --prefix projects/mj-mcp-layer/mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Install platform dependencies
        run: npm ci --prefix projects/mj-mcp-layer/platform --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm install --prefix projects/mj-mcp-layer/frontend --ignore-scripts --no-audit --no-fund

      - name: Run MJ golden path
        run: npm --prefix projects/mj-mcp-layer run mj:golden

      - name: Generate SBOMs
        run: |
          mkdir -p projects/mj-mcp-layer/artifacts/evidence
          npm sbom --prefix projects/mj-mcp-layer/mcp-layer --sbom-format=cyclonedx --json > projects/mj-mcp-layer/artifacts/evidence/sbom.mcp-layer.json
          npm sbom --prefix projects/mj-mcp-layer/platform --sbom-format=cyclonedx --json > projects/mj-mcp-layer/artifacts/evidence/sbom.platform.json
          cd projects/mj-mcp-layer/artifacts/evidence
          sha256sum sbom*.json > sbom-checksums.sha256

      - name: Audit dependencies
        run: |
          npm audit --prefix projects/mj-mcp-layer/mcp-layer --audit-level=high
          npm audit --prefix projects/mj-mcp-layer/platform --audit-level=high
          npm audit --prefix projects/mj-mcp-layer/frontend --audit-level=high

      - name: Validate Cloudflare scripts
        run: bash -n projects/mj-mcp-layer/cloudflare/*.sh

      - name: Validate mini-lane manifests
        run: npm --prefix projects/mj-mcp-layer run validate:lanes

      - name: Dry-run Worker bundle
        run: |
          set -eo pipefail
          npx wrangler deploy --dry-run 2>&1 | tee ../artifacts/evidence/cloudflare-dry-run.txt
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "../artifacts/evidence/cloudflare-dry-run.json";
          fs.writeFileSync(path, JSON.stringify({
            generated_at: new Date().toISOString(),
            command: "npx wrangler deploy --dry-run",
            output: "cloudflare-dry-run.txt",
            status: "passed"
          }, null, 2) + "\n");
          NODE
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-layer-validation-evidence
          path: projects/mj-mcp-layer/artifacts/evidence/**
          retention-days: 30

  deploy-worker:
    runs-on: ubuntu-latest
    needs: validate-build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm ci --prefix projects/mj-mcp-layer/mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Build dashboard assets
        run: |
          npm install --prefix projects/mj-mcp-layer/frontend --ignore-scripts --no-audit --no-fund
          npm --prefix projects/mj-mcp-layer/frontend run build

      - name: Apply D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 execute ellis-aegis-control-plane --remote --file=./migrations/0001_init.sql
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Resolve Workers.dev smoke URL
        id: smoke-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`, {
              headers: { authorization: `Bearer ${token}` },
            });
            const payload = await response.json();
            if (!payload.success || !payload.result?.subdomain) {
              throw new Error(`Unable to resolve Workers.dev subdomain: ${JSON.stringify(payload.errors || [])}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=https://mj-edge.${payload.result.subdomain}.workers.dev\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Smoke test deployed Worker
        env:
          MCP_SMOKE_BASE_URL: ${{ steps.smoke-url.outputs.base_url }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: npm run smoke
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Write deployment manifest
        run: npm run manifest:deployment
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-layer-deployment-manifest
          path: |
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/deployment-manifest.json
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/smoke-results.json
          retention-days: 30

  harden-and-scan:
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardening == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - zone_name: ellis-aegis.us
            zone_id_secret: CF_ZONE_ID_ELLIS
          - zone_name: hitch.guru
            zone_id_secret: CF_ZONE_ID_HITCH
          - zone_name: kevis.online
            zone_id_secret: CF_ZONE_ID_KEVIS
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install automation dependencies
        run: npm ci --prefix projects/mj-mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Resolve zone id
        id: zone
        shell: bash
        env:
          CF_ZONE_ID_ELLIS: ${{ secrets.CF_ZONE_ID_ELLIS }}
          CF_ZONE_ID_HITCH: ${{ secrets.CF_ZONE_ID_HITCH }}
          CF_ZONE_ID_KEVIS: ${{ secrets.CF_ZONE_ID_KEVIS }}
        run: |
          key='${{ matrix.zone_id_secret }}'
          val="$(printenv "$key" || true)"
          if [ -z "$val" ]; then
            echo "Missing secret $key - skipping zone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zone_id=$val" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Preflight
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/00-preflight.sh

      - name: Harden
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/99-run-cloudflare-hardening.sh
          if [ -f artifacts/stage-failures.log ]; then
            echo "Hardening stage failures detected"
            cat artifacts/stage-failures.log
            exit 1
          fi

      - name: Scan
        if: steps.zone.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd projects/mj-mcp-layer
          bash cloudflare/sentinel-scan.sh

      - name: Upload hardening artifacts
        if: always() && steps.zone.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mj-layer-hardening-${{ matrix.zone_name }}
          path: projects/mj-mcp-layer/artifacts/**
          retention-days: 30
