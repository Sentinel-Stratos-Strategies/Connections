name: MJ Enterprise Lanes Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      target_base_url:
        description: "Optional smoke-test base URL override. Leave blank to use the deployed Workers.dev URL."
        required: false
        default: ""
        type: string
  push:
    branches: ["main"]
    paths:
      - "projects/mj-mcp-layer/**"
      - "projects/mj-mcp/**"
      - ".github/workflows/mj-enterprise-lanes-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "projects/mj-mcp-layer/**"
      - "projects/mj-mcp/**"
      - ".github/workflows/mj-enterprise-lanes-deploy.yml"

permissions:
  contents: read

jobs:
  validate-enterprise-lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace utilities
        run: npm ci --prefix projects/mj-mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Install Worker dependencies
        run: npm ci --prefix projects/mj-mcp-layer/mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Install platform dependencies
        run: npm ci --prefix projects/mj-mcp-layer/platform --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix projects/mj-mcp-layer/frontend --ignore-scripts --no-audit --no-fund

      - name: Validate source mesh
        run: |
          npm --prefix projects/mj-mcp-layer run validate:lanes
          npm --prefix projects/mj-mcp-layer run validate:runtime-lanes

      - name: Run MJ golden path
        run: npm --prefix projects/mj-mcp-layer run mj:golden

      - name: Dry-run enterprise Worker bundle
        run: |
          set -eo pipefail
          mkdir -p ../artifacts/evidence
          npx wrangler deploy --dry-run 2>&1 | tee ../artifacts/evidence/enterprise-lanes-dry-run.txt
          node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("../artifacts/evidence/enterprise-lanes-dry-run.json", JSON.stringify({
            generated_at: new Date().toISOString(),
            command: "npx wrangler deploy --dry-run",
            status: "passed",
            output: "enterprise-lanes-dry-run.txt"
          }, null, 2) + "\n");
          NODE
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Upload enterprise lane validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-enterprise-lanes-validation-evidence
          path: projects/mj-mcp-layer/artifacts/evidence/**
          retention-days: 30

  deploy-enterprise-lanes:
    runs-on: ubuntu-latest
    needs: validate-enterprise-lanes
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm ci --prefix projects/mj-mcp-layer/mcp-layer --ignore-scripts --no-audit --no-fund

      - name: Build dashboard assets
        run: |
          npm ci --prefix projects/mj-mcp-layer/frontend --ignore-scripts --no-audit --no-fund
          npm --prefix projects/mj-mcp-layer/frontend run build

      - name: Apply D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 execute ellis-aegis-control-plane --remote --file=./migrations/0001_init.sql
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Resolve enterprise smoke URL
        id: smoke-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TARGET_BASE_URL: ${{ inputs.target_base_url }}
        run: |
          if [ -n "$TARGET_BASE_URL" ]; then
            echo "base_url=$TARGET_BASE_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`, {
              headers: { authorization: `Bearer ${token}` },
            });
            const payload = await response.json();
            if (!payload.success || !payload.result?.subdomain) {
              throw new Error(`Unable to resolve Workers.dev subdomain: ${JSON.stringify(payload.errors || [])}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=https://mj-edge.${payload.result.subdomain}.workers.dev\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Smoke test control plane
        env:
          MCP_SMOKE_BASE_URL: ${{ steps.smoke-url.outputs.base_url }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: npm run smoke
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Smoke test enterprise runtime lanes
        env:
          MCP_SMOKE_BASE_URL: ${{ steps.smoke-url.outputs.base_url }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: npm run smoke:enterprise-lanes
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Write deployment manifest
        run: npm run manifest:deployment
        working-directory: projects/mj-mcp-layer/mcp-layer

      - name: Upload enterprise lane deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-enterprise-lanes-deployment
          path: |
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/deployment-manifest.json
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/smoke-results.json
            projects/mj-mcp-layer/artifacts/mj-mcp-layer/enterprise-lane-smoke-results.json
          retention-days: 30
